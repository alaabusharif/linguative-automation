name: Lead scouting crawler

# Runs crawler/run.py on a schedule from a normal GitHub-hosted runner, which
# has ordinary internet access — unlike a sandboxed Claude Code session,
# nothing here is blocked by a network egress policy. See README.md's
# "Lead-scouting" section for the full picture (this is the "Alternative:
# crawler/" path made automatic).

on:
  schedule:
    # 06:17 UTC daily. Off the hour on purpose so this doesn't pile up with
    # every other workflow on the planet scheduled for a round hour.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: >-
          Skip posting to the tracking issue and skip persisting snapshots
          to lead-scouting-data — use this to test a branch's changes
          without touching production state. Always off for scheduled runs.
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

concurrency:
  group: lead-scouting

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine dry-run mode
        id: mode
        run: |
          echo "dry_run=${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}" >> "$GITHUB_OUTPUT"

      - name: Restore previous snapshots from the data branch
        # data/snapshots/ used to live only in the Actions cache, which is
        # evicted after 7 days of no runs — a quiet week made the crawler
        # forget what it had already seen and re-flag old tenders as new.
        # The lead-scouting-data branch is a durable, inspectable store for
        # the same folder (both the .txt page snapshots and the .ids.json
        # API-source snapshots).
        run: |
          git fetch origin lead-scouting-data
          git archive origin/lead-scouting-data -- data/snapshots | tar -x

      - name: Run crawler
        id: crawl
        run: |
          set -o pipefail
          python3 -m crawler.run | tee crawler_output.txt
          flagged=$(grep -oP 'Flagged: \K[0-9]+' crawler_output.txt || echo 0)
          errors=$(grep -oP 'Errors: \K[0-9]+' crawler_output.txt || echo 0)
          echo "flagged=$flagged" >> "$GITHUB_OUTPUT"
          echo "errors=$errors" >> "$GITHUB_OUTPUT"

      - name: Print report to the job log
        if: always()
        run: cat data/leads/latest.md

      - name: Persist snapshots to the data branch
        if: always() && steps.mode.outputs.dry_run != 'true'
        run: |
          git config user.name "lead-scouting-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin lead-scouting-data
          git worktree add /tmp/lead-scouting-data origin/lead-scouting-data
          rm -rf /tmp/lead-scouting-data/data/snapshots
          cp -r data/snapshots /tmp/lead-scouting-data/data/snapshots
          cd /tmp/lead-scouting-data
          git add data/snapshots
          if ! git diff --cached --quiet; then
            git commit -m "Lead scouting run — $(date -u +%F)"
            git push origin HEAD:lead-scouting-data
          fi

      - name: Upload report as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lead-scouting-report
          path: data/leads/latest.md
          retention-days: 30

      - name: Post findings to a tracking issue
        # Post whenever there's something worth a look OR a source failed to
        # fetch — errors used to only surface piggybacked on a flagged run,
        # so a quiet day with a broken source (e.g. an API start returning
        # 403/400) went unreported until something else happened to flag.
        if: (steps.crawl.outputs.flagged != '0' || steps.crawl.outputs.errors != '0') && steps.mode.outputs.dry_run != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('data/leads/latest.md', 'utf8');
            const title = 'Lead scouting: new candidates';

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'lead-scouting',
            });
            let issueNumber = issues.find((i) => i.title === title)?.number;

            if (!issueNumber) {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: 'Tracking issue for the automated lead-scouting crawler. Each run that finds new candidates posts a comment below — review and decide what becomes a HubSpot Company/Deal.',
                labels: ['lead-scouting'],
              });
              issueNumber = created.data.number;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body,
            });

      - name: Alert on crawl failure
        if: failure() && steps.crawl.outcome == 'failure' && steps.mode.outputs.dry_run != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Lead scouting: new candidates';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The lead scouting crawler crashed on ${new Date().toISOString().slice(0, 10)} before it could produce a report.`,
              'No leads were checked this run — see the run log for the error:',
              runUrl,
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'lead-scouting',
            });
            let issueNumber = issues.find((i) => i.title === title)?.number;

            if (!issueNumber) {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: 'Tracking issue for the automated lead-scouting crawler. Each run that finds new candidates posts a comment below — review and decide what becomes a HubSpot Company/Deal.',
                labels: ['lead-scouting'],
              });
              issueNumber = created.data.number;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body,
            });
